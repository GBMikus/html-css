<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Layout na prática</title>
    <style>
        div.conteiner {border: 3px solid blue; display: grid; grid-auto-flow: row; grid-auto-columns: 100px 40% repeat(2,1fr); grid-template-rows: repeat(3,80px); gap: 10px; /* align-items: start; justify-items: center; */ place-items: normal normal; /* align-content: space-between; justify-content: end; */ place-content: normal normal;}

        div.item {border: 3px solid red; padding: 5px;}
    </style>
</head>
<body>
    <main>
        <div class="conteiner">
            <div class="item">A</div>
            <div class="item">B</div>
            <div class="item">C</div>
            <div class="item">D</div>
            <div class="item">E</div>
            <div class="item">F</div>
            <div class="item">G</div>
            <div class="item">H</div>
            <div class="item">I</div>
            <div class="item">J</div>
        </div>
    </main>
</body>
</html>

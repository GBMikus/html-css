<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox</title>
    <style>
        div.contain {background-color: chartreuse; display: flex; flex-flow: row nowrap;}

        div.item {background-color: chocolate; border: 1px solid black; padding: 20px;}

        div#il1 {order: 0;}

        div#il2 {order: -2;}

        div#il3 {order: 8;}

        div#il4 {order: -30;}
        
        div#il5 {order: 0;}

        div#il6 {order: 0;}

        div#il7 {order: 0;}

        div#il8 {order: 0;}

        div#il9 {order: 0;}
    </style>
</head>
<body>
    <div class="contain">
        <div class="item" id="il1">A</div>
        <div class="item" id="il2">B</div>
        <div class="item" id="il3">C</div>
        <div class="item" id="il4">D</div>
        <div class="item" id="il5">E</div>
        <div class="item" id="il6">F</div>
        <div class="item" id="il7">G</div>
        <div class="item" id="il8">H</div>
        <div class="item" id="il9">I</div>
    </div>
</body>
</html>

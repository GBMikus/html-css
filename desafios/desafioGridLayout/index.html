<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio Grid Layout</title>
    <style>
        div.content {display: grid; grid-template-rows: repeat(6, 100px); grid-template-columns: repeat(4, 1fr); gap: 5px;}

        div.topo {grid-row: 1/3; grid-column: 1/5; background-color: green;}

        div.menu {grid-area: 3/1/4/5; background-color: blue;}

        div.princ {grid-row: span 3/ span 7; grid-column: 1 / span 3; background-color: yellow;}

        div.sec {grid-area: 4/4/7/5; background-color: orange;}

        div.rod {grid-row-start: 7; grid-row-end: 8; grid-column-start: 1; grid-column-end: 5; background-color: red;}
    </style>
</head>
<body>
    <div class="content">
        <div class="topo"><p style="color: white;">Topo</p></div>
        <div class="menu"><p style="color: white;">Menu</p></div>
        <div class="princ"><p>Menu</p></div>
        <div class="sec"><p>Secundário</p></div>
        <div class="rod"><p>Rodapé</p></div>
    </div>
</body>
</html>

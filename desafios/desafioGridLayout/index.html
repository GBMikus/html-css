<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio Grid Layout</title>
    <style>
        * {padding: 0px; margin: 0px; box-sizing: border-box;}

        div.content {width: 100vw; height: 100vh; display: grid; grid-template-rows: 80px 40px 200px 40px; grid-template-columns: 1fr 150px; gap: 5px;}

        div.topo {grid-row: 1/2; grid-column: 1/-1; background-color: green;}

        div.menu {grid-area: 2/1/3/3; background-color: blue;}

        div.princ {grid-row: span 2/ span 3; grid-column: 1 / span 1; background-color: yellow;}

        div.sec {grid-area: 3/2/5/3; background-color: orange;}

        div.rod {grid-row-start: 5; grid-row-end: 5; grid-column-start: 1; grid-column-end: 3; background-color: red;}
    </style>
</head>
<body>
    <div class="content">
        <div class="topo"><p style="color: white;">Topo</p></div>
        <div class="menu"><p style="color: white;">Menu</p></div>
        <div class="princ"><p>Menu</p></div>
        <div class="sec"><p>Secundário</p></div>
        <div class="rod"><p>Rodapé</p></div>
    </div>
</body>
</html>
